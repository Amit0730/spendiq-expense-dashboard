<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#10b981" stroke-width="2" stroke-opacity="0.3" />
  
  <!-- Trend Path with Glow -->
  <path d="M12 44 L24 32 L34 38 L52 18" stroke="url(#lineGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Peak Dot -->
  <circle cx="52" cy="18" r="4.5" fill="#34d399" stroke="#ffffff" stroke-width="2" />
  
  <!-- Currency symbol or sparkline bar -->
  <rect x="18" y="46" width="4" height="6" rx="2" fill="#10b981" opacity="0.6" />
  <rect x="28" y="42" width="4" height="10" rx="2" fill="#10b981" opacity="0.8" />
  <rect x="38" y="40" width="4" height="12" rx="2" fill="#34d399" />
</svg>
